<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주류 백과사전 - 백주</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --primary-color: #c8102e;
            --text-main: #212529;
            --text-sub: #6c757d;
            --border-color: #e9ecef;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
        }

        .mobile-container {
            width: 100%;
            max-width: 480px;
            background-color: #fff;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }

        header {
            position: sticky;
            top: 0;
            background-color: #fff;
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            z-index: 100;
        }

        .home-banner {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: bold;
            font-size: 1.1rem;
            width: fit-content;
        }

        .search-section {
            padding: 16px;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 0.9rem;
            background-color: #f1f3f5;
            outline: none;
            transition: all 0.2s;
        }

        .search-input:focus {
            background-color: #fff;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(200, 16, 46, 0.1);
        }

        .stats-section {
            padding: 0 16px 16px 16px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background-color: #f8f9fa;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .stat-count {
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .category-tabs {
            display: flex;
            gap: 8px;
            padding: 0 16px 16px 16px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }

        .category-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background-color: #fff;
            color: var(--text-sub);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background-color: var(--primary-color);
            color: #fff;
            border-color: var(--primary-color);
            font-weight: bold;
        }

        main {
            flex: 1;
        }

        .liquor-list {
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .liquor-card {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            background-color: var(--card-bg);
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .liquor-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .liquor-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .liquor-name {
            font-size: 1rem;
            font-weight: bold;
        }

        .liquor-meta {
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            background-color: #fff0f3;
            color: var(--primary-color);
        }

        .liquor-detail {
            display: none;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed var(--border-color);
            font-size: 0.85rem;
            color: var(--text-main);
            line-height: 1.5;
        }

        .liquor-card.open .liquor-detail {
            display: block;
        }

        .detail-desc {
            color: #495057;
            margin-bottom: 10px;
            white-space: pre-line;
        }

        .detail-info-list {
            background-color: #f8f9fa;
            padding: 10px 12px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .detail-info-item {
            display: flex;
            gap: 6px;
        }

        .info-label {
            font-weight: bold;
            color: var(--text-sub);
            min-width: 45px;
        }

        .famous-tag-5 {
            color: #c8102e;
            font-weight: bold;
        }

        .famous-tag-4 {
            color: #d9480f;
            font-weight: bold;
        }

        .candidate-tag-3 {
            color: #e67e22;
            font-weight: bold;
        }

        footer {
            margin-top: 30px;
            padding: 20px 16px;
            background-color: #f1f3f5;
            border-top: 1px solid var(--border-color);
            text-align: center;
        }

        .footer-notice {
            font-size: 0.75rem;
            color: #868e96;
            line-height: 1.5;
            word-break: keep-all;
        }

        .footer-notice .en {
            margin-top: 4px;
            font-size: 0.7rem;
            color: #adb5bd;
        }
    </style>
</head>
<body>

<div class="mobile-container">

            <span class="icon">🍶</span>
            <span>주류 백과사전</span>
        </a>
    </header>

    </section>
