            background-color: #fff;
            min-height: 100vh;

            display: flex;
            flex-direction: column;
        }

            top: 0;
            background-color: #fff;
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            z-index: 100;
        }

            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: bold;
            font-size: 1.1rem;
            width: fit-content;
        }

        .search-section {
            padding: 16px;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 0.9rem;
            background-color: #f1f3f5;
            outline: none;
            transition: all 0.2s;
        }

        .search-input:focus {
            background-color: #fff;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(200, 16, 46, 0.1);
        }

        .stats-section {
            padding: 0 16px 16px 16px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background-color: #f8f9fa;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .stat-count {
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .category-tabs {
            display: flex;
            gap: 8px;
            padding: 0 16px 16px 16px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }

        .category-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background-color: #fff;
            color: var(--text-sub);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background-color: var(--primary-color);
            color: #fff;
            border-color: var(--primary-color);
            font-weight: bold;
        }

        main {
            flex: 1;
        }

        .liquor-list {
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .liquor-card {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            background-color: var(--card-bg);
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .liquor-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .liquor-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .liquor-name {
            font-size: 1rem;
            font-weight: bold;
        }

        .liquor-meta {
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            background-color: #fff0f3;
            color: var(--primary-color);
        }

            display: none;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed var(--border-color);
            font-size: 0.85rem;
            color: var(--text-main);
            line-height: 1.5;

            color: #495057;
            margin-bottom: 10px;
            white-space: pre-line;

            background-color: #f8f9fa;

            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;

            color: var(--text-sub);

</head>

            name: "연태고량주 (골드)",
            type: "농향형",
            region: "산동성 옌타이 (Yantai)",
            price: "약 12,000원 ~ 25,000원",
            dutyFree: "면세점 미입점",
            tagType: "none",
            desc: `한국에서 가장 유명하고 보편적인 인기 농향 백주입니다.`
        }
    ];

    let currentCategory = '전체';

    // 안전한 카운트 업데이트 함수
    function updateCounts() {
        let nongCount = 0;
        let jangCount = 0;
        let bongCount = 0;
        let cheongCount = 0;
        let etcCount = 0;

        liquorData.forEach(item => {
            const type = item.type || '';
            if (type.includes('농향')) nongCount++;
            else if (type.includes('장향')) jangCount++;
            else if (type.includes('봉향')) bongCount++;
            else if (type.includes('청향')) cheongCount++;
            else etcCount++;
        });

        // HTML ID인 cnt- 시리즈와 안전하게 매칭
        const elTotal = document.getElementById('cnt-total');
        const elNong = document.getElementById('cnt-nong');
        const elJang = document.getElementById('cnt-jang');
        const elBong = document.getElementById('cnt-bong');
        const elCheong = document.getElementById('cnt-cheong');
        const elEtc = document.getElementById('cnt-etc');

        if(elTotal) elTotal.innerText = liquorData.length;
        if(elNong) elNong.innerText = nongCount;
        if(elJang) elJang.innerText = jangCount;
        if(elBong) elBong.innerText = bongCount;
        if(elCheong) elCheong.innerText = cheongCount;
        if(elEtc) elEtc.innerText = etcCount;
    }

    function renderList(data) {
        const listContainer = document.getElementById('liquorList');
        if(!listContainer) return;
        
        listContainer.innerHTML = '';

        if (data.length === 0) {
            listContainer.innerHTML = '<div style="text-align:center; color: var(--text-sub); padding: 30px 0;">검색 결과가 없습니다.</div>';
            return;
        }

        data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'liquor-card';
            card.onclick = function() { this.classList.toggle('open'); };

            let tagHtml = '';
            if (item.tagType === 'famous5') {
                tagHtml = `<div class="detail-info-item"><span class="info-label">비고:</span><span class="famous-tag-5">${item.tagText}</span></div>`;
            } else if (item.tagType === 'famous4') {
                tagHtml = `<div class="detail-info-item"><span class="info-label">비고:</span><span class="famous-tag-4">${item.tagText}</span></div>`;
            } else if (item.tagType === 'candidate3') {
                tagHtml = `<div class="detail-info-item"><span class="info-label">비고:</span><span class="candidate-tag-3">${item.tagText}</span></div>`;
            }

            card.innerHTML = `
                <div class="liquor-card-header">
                    <div class="liquor-info">
                        <div class="liquor-name">${item.name}</div>
                        <div class="liquor-meta">${item.region}</div>
                    </div>
                    <span class="badge">${item.type}</span>
                </div>
                <div class="liquor-detail">
                    <div class="detail-desc">${item.desc}</div>
                    <div class="detail-info-list">
                        <div class="detail-info-item">
                            <span class="info-label">지역:</span>
                            <span>${item.region}</span>
                        </div>
                        <div class="detail-info-item">
                            <span class="info-label">가격:</span>
                            <span>${item.price} (${item.dutyFree})</span>
                        </div>
                        ${tagHtml}
                    </div>
                </div>
            `;
            listContainer.appendChild(card);
        });
    }

    function filterList() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        
        const filtered = liquorData.filter(item => {
            const typeStr = item.type || '';
            
            let matchesCategory = false;
            if (currentCategory === '전체') {
                matchesCategory = true;
            } else if (currentCategory === '기타') {
                matchesCategory = !typeStr.includes('농향') && !typeStr.includes('장향') && !typeStr.includes('봉향') && !typeStr.includes('청향');
            } else {
                matchesCategory = typeStr.includes(currentCategory.replace('형', ''));
            }

            const matchesSearch = item.name.toLowerCase().includes(query) ||
                                  typeStr.toLowerCase().includes(query) ||
                                  item.region.toLowerCase().includes(query) ||
                                  item.desc.toLowerCase().includes(query);

            return matchesCategory && matchesSearch;
        });

        renderList(filtered);
    }

    function setCategory(category) {
        currentCategory = category;
        
        const buttons = document.querySelectorAll('.tab-btn');
        buttons.forEach(btn => {
            if (btn.innerText.trim() === category) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });

        filterList();
    }

    function resetFilter() {
        document.getElementById('searchInput').value = '';
        setCategory('전체');
    }

    // 문서가 준비되었을 때 안전하게 실행
    document.addEventListener("DOMContentLoaded", function() {
        updateCounts();
        renderList(liquorData);
    });
</script>

</body>
</html>
